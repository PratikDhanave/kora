# The 14 AI-DLC agent personas (awslabs/aidlc-workflows) as kora Agents: 11 domain experts, 2
# review-only agents (product-lead, architecture-reviewer) and the adaptive-workflows composer.
# Lead/support stages follow the AI-DLC Agents guide.
#
# In AI-DLC itself these are personas: one conductor drives every stage and adopts them in its own
# context, and agents never invoke each other. That conductor is the `aidlc` agent
# (deploy/local/declarative/agent-aidlc.yaml), which carries all 14. Deploying each persona as its
# own kora Agent adds a per-role run surface (one SPIFFE identity, OPA policy and budget per role)
# for consulting a single persona on a single stage.
#
# Annotations: aidlc.runkora.io/persona is the AI-DLC agent name, aidlc.runkora.io/kind is
# expert | reviewer | composer, aidlc.runkora.io/phases lists the phases the persona joins.
#
# Model is ollama/qwen3 so every agent applies directly on the local cluster. In production swap
# `model` to a frontier model (the 33 stages need it) — see examples/aidlc/environment.yaml.
#
# Apply all:            kubectl apply -f examples/aidlc/agents.yaml
# Each agent reserves a session-manager pod; the laptop cluster sets agents.scheduling.minReplicas: 1
# (deploy/reference/values/kora.local.yaml) and still saturates near the full roster.

# ───────────────────────── Composer ─────────────────────────
apiVersion: runkora.io/v1alpha1
kind: Agent
metadata:
  name: aidlc-composer
  namespace: kora-tenant-example
  annotations: {runkora.io/repository: github.com/runkora/kora, aidlc.runkora.io/persona: aidlc-composer-agent, aidlc.runkora.io/kind: composer, aidlc.runkora.io/phases: initialization}
spec:
  displayName: AI-DLC Composer
  description: The adaptive-workflows composer — tailors the stage set to the task (/aidlc compose).
  framework: claude-code
  identityMode: autonomous
  model: {family: ollama, name: qwen3}
  budget: {limitUSD: 5, resetCadence: monthly}
  systemPrompt: |
    You are aidlc-composer-agent, the AI-DLC adaptive-workflows composer, governed by kora. Given a
    work request, propose the workflow: the closest profile (classic, express, feature, enterprise,
    mvp, poc, bugfix, refactor, infra, security-patch, workshop), then the exact stages to run from
    the 33 across Ideation, Inception, Construction and Operation, and which conditional stages to
    skip, each with a one-line reason. You compose; you do not execute stages.
    > Gate: Approve / Request Changes — confirm the composed stage list.

