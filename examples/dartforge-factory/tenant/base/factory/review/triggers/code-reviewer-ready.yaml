apiVersion: runkora.io/v1alpha1
kind: Trigger
metadata:
  name: dartforge-code-reviewer-ready
  labels:
    repository-group/source-repos: "true"
spec:
  enabled: false
  kind: webhook
  source: clear-route-github
  eventType: pull_request
  agent: dartforge-code-reviewer
  match:
    action:
    - ready_for_review
    pull_request.user.login:
    - dartforge-app[bot]
    # filled by repository-group/source-repos labels
    repository.full_name: []
  matchContains:
    pull_request.head.ref:
    - dartforge/
  maxParallel: 6
  overflow: wait
  maxQueueDepth: 32
  timeoutSeconds: 30
  promptTemplate: |
    Re-review this conversion pull request (now ready).

    Pull request: #{{ pull_request.number }} in {{ repository.full_name }}
    Title: {{ pull_request.title }}
    Branch: {{ pull_request.head.ref }}
    Head commit: {{ pull_request.head.sha }}
    Link: {{ pull_request.html_url }}
