apiVersion: runkora.io/v1alpha1
kind: Trigger
metadata:
  name: dartforge-watcher-merged
  labels:
    repository-group/source-repos: "true"
spec:
  enabled: false
  kind: webhook
  source: clear-route-github
  eventType: pull_request
  routing:
    candidates:
    - dartforge-watcher
    model:
      family: typesafe
      name: jev-1-14
    fallback: dartforge-watcher
    joinRuns: true
  match:
    # filled by repository-group/source-repos labels
    repository.full_name: []
    action:
    - closed
    pull_request.merged:
    - "true"
    pull_request.user.login:
    - dartforge-app[bot]
  matchContains:
    pull_request.head.ref:
    - dartforge/
  maxParallel: 4
  overflow: wait
  maxQueueDepth: 32
  timeoutSeconds: 30
  promptTemplate: |
    A conversion pull request was merged.

    Repository: {{ repository.full_name }}
    Pull request: #{{ pull_request.number }}
    Title: {{ pull_request.title }}
    Branch: {{ pull_request.head.ref }}
    Link: {{ pull_request.html_url }}
