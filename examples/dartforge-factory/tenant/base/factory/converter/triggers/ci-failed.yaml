apiVersion: runkora.io/v1alpha1
kind: Trigger
metadata:
  name: dartforge-converter-ci-failed
  labels:
    repository-group/source-repos: "true"
spec:
  enabled: false
  kind: webhook
  source: clear-route-github
  eventType: workflow_run
  routing:
    candidates:
    - dartforge-converter-swift
    - dartforge-converter-kotlin
    model:
      family: typesafe
      name: jev-1-14
    fallback: dartforge-converter-swift
    joinRuns: true
    joinKey: '{{ repository.full_name }}#{{ workflow_run.pull_requests.0.number }}'
  match:
    # filled by repository-group/source-repos labels
    repository.full_name: []
    action:
    - completed
    workflow_run.conclusion:
    - failure
    workflow_run.actor.login:
    - dartforge-app[bot]
  matchContains:
    workflow_run.head_branch:
    - dartforge/
  coalesce:
    key: "{{ repository.full_name }}@{{ workflow_run.head_sha }}"
    windowSeconds: 60
  maxParallel: 4
  overflow: wait
  maxQueueDepth: 32
  timeoutSeconds: 30
  promptTemplate: |
    CI failed on a conversion pull request.

    Repository: {{ repository.full_name }}
    Pull request: #{{ workflow_run.pull_requests.0.number }}
    Branch: {{ workflow_run.head_branch }}
    Run: {{ workflow_run.html_url }}
