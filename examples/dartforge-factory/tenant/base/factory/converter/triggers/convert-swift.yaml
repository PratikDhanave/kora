apiVersion: runkora.io/v1alpha1
kind: Trigger
metadata:
  name: dartforge-converter-swift-convert
  labels:
    repository-group/source-repos: "true"
spec:
  enabled: false
  kind: webhook
  source: clear-route-github
  eventType: issues
  # One candidate for the swift lane; the label picks the converter, the model only decides joins.
  routing:
    candidates:
    - dartforge-converter-swift
    model:
      family: typesafe
      name: jev-1-14
    fallback: dartforge-converter-swift
    joinRuns: true
    joinKey: '{{ repository.full_name }}#{{ issue.number }}'
  match:
    action:
    - labeled
    label.name:
    - dartforge:convert
    # Only trusted issue authors are processed, so an outside author's issue.title/body is never fed to a write-capable agent.
    issue.author_association:
    - OWNER
    - MEMBER
    - COLLABORATOR
    # filled by repository-group/source-repos labels
    repository.full_name: []
  # issue.labels renders as a JSON array, so a substring match on the label name is exact.
  matchContains:
    issue.labels:
    - source-lang:swift
  coalesce:
    key: 'dartforge-convert-swift:{{ repository.full_name }}#{{ issue.number }}'
    windowSeconds: 60
  maxParallel: 4
  overflow: wait
  maxQueueDepth: 32
  timeoutSeconds: 30
  promptTemplate: |
    Issue {{ repository.full_name }}#{{ issue.number }} is ready to convert (swift).

    Repository: {{ repository.full_name }}
    Number: #{{ issue.number }}
    Title: {{ issue.title }}
    Link: {{ issue.html_url }}
