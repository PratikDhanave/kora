apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app-key
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: github-app-key
  data:
  - secretKey: key.pem
    remoteRef:
      key: constellation/kora/prod/tenants/dartforge/github-app
      property: private_key_pem
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clear-route-github-webhook
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: clear-route-github-webhook
  data:
  - secretKey: secret
    remoteRef:
      key: constellation/kora/prod/tenants/dartforge/github-webhook
      property: secret
