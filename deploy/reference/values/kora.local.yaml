# Local k3d overrides layered onto values/kora.yaml by make up. Excluded from
# the cloud example; used only by the local environment.
global:
  imageRegistry: kora-registry:5001
  imageTag: latest
  imagePullPolicy: Always
  logFormat: console
  postgres:
    sslMode: disable
    captureQueryText: true
  observability:
    otlpEndpoint: ""

frontendHost: local.runkora.io

config:
  db:
    host: kora-postgres
  redis:
    host: kora-redis
    # The compose Redis serves plaintext.
    tls:
      enabled: false

identity:
  config:
    accessTokenTtlMinutes: 240

frontend:
  config:
    nextPublicAppUrl: https://local.runkora.io:8443

# Mirrored into the k3d registry by make docker-pull-third-party.
opaGateway:
  image:
    registry: kora-registry:5001
    repository: openpolicyagent/opa
    tag: 1.21.0-envoy-static

agents:
  # One session-manager pod per agent: a laptop cluster can't reserve two for
  # every agent in a full roster (e.g. the 14 AI-DLC roles).
  scheduling:
    minReplicas: 1
  # Idle session-manager pods use a fraction of the istio-proxy's 100m default
  # request; trimming it fits a full roster on the laptop. Limits are unchanged.
  workloads:
    sessionManager:
      podAnnotations:
        sidecar.istio.io/proxyCPU: 20m
  sandboxImages:
    warmBase: true
    # make up does not build the bundled images. Run make redeploy-sandbox-images
    # first, then enable the ones you need.
    bundled:
      go:
        enabled: false
      python:
        enabled: false
      node:
        enabled: false
    # Image references name kora-registry:5001. Inside the cluster the k3d
    # registry serves plain HTTP on kora-registry:5000.
    registryMirrors:
      kora-registry:5001: http://kora-registry:5000
    registryPorts:
      - 5000

# The k3d node kernel loads nfsd and the NFS client on demand.
sandboxMount:
  enabled: true

operator:
  replicas: 1
  leaderElection: false
  podDisruptionBudget:
    enabled: false
  # Smaller OPA sidecar request on tenant pods, for the same laptop budget.
  # Sandbox sidecars are pinned separately (injection.sandboxSidecars).
  injection:
    opa:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 128Mi

# Smaller identity-proxy sidecar request on tenant pods; limits unchanged.
identityProxy:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi

egressGateway:
  # The local Kubernetes connection points at the k3d API server, which listens
  # on 6443. deploy/local/connections/kubernetes.yaml and
  # scripts/cluster/register-k8s-connection.sh register it.
  upstreamPorts:
    - 6443
